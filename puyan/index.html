/* 版面：環景滿版；左上案名、下方房間列、右下平面圖；單一深色玻璃面板（疊在照片上，刻意不跟系統明暗切換） */
:root {
  --bg: #15130f;
  --panel: rgba(27, 24, 20, 0.80);
  --ink: #f4efe7;
  --ink-soft: #cfc6b8;
  --line: rgba(244, 239, 231, 0.20);
  --brass: #cdaa6b;
  --brass-ink: #1d1913;
  --f-display: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --f-ui: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 18px; overflow: hidden; }
#pano { position: fixed; inset: 0; z-index: 0; }
.pnlm-container { background: var(--bg); font-family: var(--f-ui); }
.pnlm-controls-container { left: auto; right: calc(16px + env(safe-area-inset-right, 0px)); top: calc(16px + env(safe-area-inset-top, 0px)); }
.pnlm-load-box { background: var(--panel); border-radius: 12px; font-size: 18px; }

.head { position: fixed; z-index: 5; top: calc(14px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px));
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 18px; backdrop-filter: blur(6px);
  max-width: min(520px, calc(100vw - 100px)); }
.logo { display: block; height: 52px; width: auto; margin: 2px 0 8px -4px; }
.eyebrow { font-size: 14px; letter-spacing: 0.12em; color: var(--brass); }
.case { font-family: var(--f-display); font-size: 30px; line-height: 1.25; margin: 2px 0 0; text-wrap: balance; }
.now { font-size: 18px; color: var(--ink-soft); margin-top: 2px; }
.now b { color: var(--ink); font-weight: 700; }
.mode { display: flex; gap: 8px; margin-top: 10px; }
.mode button { flex: 1; min-height: 46px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--line);
  background: transparent; color: var(--ink); font: 500 18px var(--f-ui); cursor: pointer; }
.mode button[aria-pressed="true"] { background: var(--brass); color: var(--brass-ink); border-color: var(--brass); font-weight: 700; }
.mode button:focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; }

.rooms { position: fixed; z-index: 5; left: 0; right: 0; bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; }
.rooms button { flex: none; min-height: 54px; padding: 0 22px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--panel); color: var(--ink); font: 500 19px/1 var(--f-ui); cursor: pointer; backdrop-filter: blur(6px); }
.rooms button[aria-current="true"] { background: var(--brass); color: var(--brass-ink); border-color: var(--brass); font-weight: 700; }
.rooms button:focus-visible, .map-toggle:focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; }

.map { position: fixed; z-index: 6; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(144px + env(safe-area-inset-bottom, 0px));
  box-sizing: border-box; width: clamp(240px, 26vw, 340px); max-width: calc(100vw - 32px); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px; backdrop-filter: blur(6px); }
.map-title { display: flex; justify-content: space-between; align-items: baseline; font-size: 16px; color: var(--ink-soft); margin-bottom: 8px; }
.plan { position: relative; border-radius: 8px; overflow: hidden; background: #fff; }
.plan img { display: block; width: 100%; height: auto; }
.dot { position: absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; border: 3px solid #fff;
  background: #3b3530; box-shadow: 0 1px 4px rgba(0,0,0,.5); cursor: pointer; padding: 0; }
.dot[aria-current="true"] { background: var(--brass); }
.cone { position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; pointer-events: none;
  background: conic-gradient(from -35deg, rgba(196,150,70,.85) 0deg 70deg, transparent 70deg); border-radius: 50%;
  -webkit-mask: radial-gradient(circle closest-side, #000 0 96%, transparent 100%); mask: radial-gradient(circle closest-side, #000 0 96%, transparent 100%); }
.pnlm-panorama-info { display: none !important; }
.scalebar { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--ink-soft); margin-top: 8px; font-variant-numeric: tabular-nums; }
.scalebar i { display: block; height: 6px; border: 2px solid var(--ink-soft); border-top: 0; }
.map[data-closed="true"] { display: none; }
.map-toggle { position: fixed; z-index: 6; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(84px + env(safe-area-inset-bottom, 0px));
  min-height: 50px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: 500 18px var(--f-ui); }

.gis-hot { width: 0; height: 0; }
.gis-hot .pill { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; display: flex; align-items: center; gap: 8px;
  padding: 10px 18px 10px 12px; border-radius: 999px; background: var(--panel); border: 2px solid var(--brass); color: var(--ink);
  font: 700 19px var(--f-ui); cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,.35); }
.gis-hot .pill::before { content: ""; width: 26px; height: 26px; border-radius: 50%; background: var(--brass);
  -webkit-mask: radial-gradient(circle, #000 0 30%, transparent 32% 52%, #000 54%); mask: radial-gradient(circle, #000 0 30%, transparent 32% 52%, #000 54%); }
.gis-hot:hover .pill { background: var(--brass); color: var(--brass-ink); }
.hint { position: fixed; z-index: 4; left: 50%; top: 50%; transform: translate(-50%, -50%); background: var(--panel); border-radius: 12px;
  padding: 12px 18px; font-size: 18px; pointer-events: none; transition: opacity .6s; }

@media (max-width: 720px) {
  .case { font-size: 24px; }
  .map { width: calc(100vw - 32px); }
}
@media (prefers-reduced-motion: reduce) { .hint { transition: none; } }
</style>

<script>
const ROOMS = [{"id": "VR1", "name": "玄關", "x": 37.07, "y": 14.72}, {"id": "VR2", "name": "客廳", "x": 60.34, "y": 31.98}, {"id": "VR3", "name": "餐廚", "x": 51.72, "y": 51.78}, {"id": "VR4", "name": "主臥", "x": 81.03, "y": 61.42}, {"id": "VR5", "name": "臥室A", "x": 24.14, "y": 36.85}, {"id": "VR6", "name": "臥室B", "x": 21.55, "y": 56.85}];
const SCENES = {"VR1": {"title": "玄關", "panorama": "pano/VR1.jpg?v=1b", "yaw": 128, "pitch": -5, "hfov": 105, "northOffset": 0, "hotSpots": [{"pitch": -2, "yaw": 125, "type": "scene", "sceneId": "VR2", "targetYaw": "sameAzimuth", "cssClass": "gis-hot", "createTooltipFunc": "HOT", "createTooltipArgs": "客廳"}, {"pitch": -22, "yaw": 145, "type": "scene", "sceneId": "VR3", "targetYaw": -110, "cssClass": "gis-hot", "createTooltipFunc": "HOT", "createTooltipArgs": "餐廚"}]}, "VR2": {"title": "客廳", "panorama": "pano/VR2.jpg?v=1b", "yaw": 45, "pitch": -5, "hfov": 105, "northOffset": 0, "hotSpots": [{"pitch": -15, "yaw": -153, "type": "scene", "sceneId": "VR3", "targetYaw": "sameAzimuth", "cssClass": "gis-hot", "createTooltipFunc": "HOT", "createTooltipArgs": "餐廚"}, {"pitch": -8, "yaw": -70, "type": "scene", "sceneId": "VR1", "targetYaw": "sameAzimuth", "cssClass": "gis-hot", "createTooltipFunc": "HOT", "createTooltipArgs": "玄關"}]}, "VR3": {"title": "餐廚", "panorama": "pano/VR3.jpg?v=1", "yaw": -80, "pitch": -5, "hfov": 105, "northOffset": 0, "hotSpots": [{"pitch": -15, "yaw": 27, "type": "scene", "sceneId": "VR2", "targetYaw": "sameAzimuth", "cssClass": "gis-hot", "createTooltipFunc": "HOT", "createTooltipArgs": "客廳"}, {"pitch": -8, "yaw": -14, "type": "scene", "sceneId": "VR1", "targetYaw": "sameAzimuth", "cssClass": "gis-hot", "createTooltipFunc": "HOT", "createTooltipArgs": "玄關"}, {"pitch": -5, "yaw": 95, "type": "scene", "sceneId": "VR4", "targetYaw": "sameAzimuth", "cssClass": "gis-hot", "createTooltipFunc": "HOT", "createTooltipArgs": "主臥"}, {"pitch": -16, "yaw": -70, "type": "scene", "sceneId": "VR5", "targetYaw": "sameAzimuth", "cssClass": "gis-hot", "createTooltipFunc": "HOT", "createTooltipArgs": "臥室A"}, {"pitch": -3, "yaw": -96, "type": "scene", "sceneId": "VR6", "targetYaw": "sameAzimuth", "cssClass": "gis-hot", "createTooltipFunc": "HOT", "createTooltipArgs": "臥室B"}]}, "VR4": {"title": "主臥", "panorama": "pano/VR4.jpg?v=1b", "yaw": 170, "pitch": -5, "hfov": 105, "northOffset": 0, "hotSpots": [{"pitch": -6, "yaw": -68, "type": "scene", "sceneId": "VR3", "targetYaw": "sameAzimuth", "cssClass": "gis-hot", "createTooltipFunc": "HOT", "createTooltipArgs": "餐廚"}]}, "VR5": {"title": "臥室A", "panorama": "pano/VR5.jpg?v=1b", "yaw": -60, "pitch": -5, "hfov": 105, "northOffset": 0, "hotSpots": [{"pitch": -5, "yaw": 118, "type": "scene", "sceneId": "VR3", "targetYaw": 15, "cssClass": "gis-hot", "createTooltipFunc": "HOT", "createTooltipArgs": "餐廚"}]}, "VR6": {"title": "臥室B", "panorama": "pano/VR6.jpg?v=1b", "yaw": -140, "pitch": -5, "hfov": 105, "northOffset": 0, "hotSpots": [{"pitch": -5, "yaw": 62, "type": "scene", "sceneId": "VR3", "targetYaw": 15, "cssClass": "gis-hot", "createTooltipFunc": "HOT", "createTooltipArgs": "餐廚"}]}, "VR1@n": {"title": "玄關", "panorama": "pano_night/VR1.jpg?v=1", "yaw": 128, "pitch": -5, "hfov": 105, "northOffset": 0, "hotSpots": [{"pitch": -2, "yaw": 125, "type": "scene", "sceneId": "VR2@n", "targetYaw": "sameAzimuth", "cssClass": "gis-hot", "createTooltipFunc": "HOT", "createTooltipArgs": "客廳"}, {"pitch": -22, "yaw": 145, "type": "scene", "sceneId": "VR3@n", "targetYaw": -110, "cssClass": "gis-hot", "createTooltipFunc": "HOT", "createTooltipArgs": "餐廚"}]}, "VR2@n": {"title": "客廳", "panorama": "pano_night/VR2.jpg?v=1", "yaw": 45, "pitch": -5, "hfov": 105, "northOffset": 0, "hotSpots": [{"pitch": -15, "yaw": -153, "type": "scene", "sceneId": "VR3@n", "targetYaw": "sameAzimuth", "cssClass": "gis-hot", "createTooltipFunc": "HOT", "createTooltipArgs": "餐廚"}, {"pitch": -8, "yaw": -70, "type": "scene", "sceneId": "VR1@n", "targetYaw": "sameAzimuth", "cssClass": "gis-hot", "createTooltipFunc": "HOT", "createTooltipArgs": "玄關"}]}, "VR3@n": {"title": "餐廚", "panorama": "pano_night/VR3.jpg?v=1", "yaw": -80, "pitch": -5, "hfov": 105, "northOffset": 0, "hotSpots": [{"pitch": -15, "yaw": 27, "type": "scene", "sceneId": "VR2@n", "targetYaw": "sameAzimuth", "cssClass": "gis-hot", "createTooltipFunc": "HOT", "createTooltipArgs": "客廳"}, {"pitch": -8, "yaw": -14, "type": "scene", "sceneId": "VR1@n", "targetYaw": "sameAzimuth", "cssClass": "gis-hot", "createTooltipFunc": "HOT", "createTooltipArgs": "玄關"}, {"pitch": -5, "yaw": 95, "type": "scene", "sceneId": "VR4@n", "targetYaw": "sameAzimuth", "cssClass": "gis-hot", "createTooltipFunc": "HOT", "createTooltipArgs": "主臥"}, {"pitch": -16, "yaw": -70, "type": "scene", "sceneId": "VR5@n", "targetYaw": "sameAzimuth", "cssClass": "gis-hot", "createTooltipFunc": "HOT", "createTooltipArgs": "臥室A"}, {"pitch": -3, "yaw": -96, "type": "scene", "sceneId": "VR6@n", "targetYaw": "sameAzimuth", "cssClass": "gis-hot", "createTooltipFunc": "HOT", "createTooltipArgs": "臥室B"}]}, "VR4@n": {"title": "主臥", "panorama": "pano_night/VR4.jpg?v=1", "yaw": 170, "pitch": -5, "hfov": 105, "northOffset": 0, "hotSpots": [{"pitch": -6, "yaw": -68, "type": "scene", "sceneId": "VR3@n", "targetYaw": "sameAzimuth", "cssClass": "gis-hot", "createTooltipFunc": "HOT", "createTooltipArgs": "餐廚"}]}, "VR5@n": {"title": "臥室A", "panorama": "pano_night/VR5.jpg?v=1", "yaw": -60, "pitch": -5, "hfov": 105, "northOffset": 0, "hotSpots": [{"pitch": -5, "yaw": 118, "type": "scene", "sceneId": "VR3@n", "targetYaw": 15, "cssClass": "gis-hot", "createTooltipFunc": "HOT", "createTooltipArgs": "餐廚"}]}, "VR6@n": {"title": "臥室B", "panorama": "pano_night/VR6.jpg?v=1", "yaw": -140, "pitch": -5, "hfov": 105, "northOffset": 0, "hotSpots": [{"pitch": -5, "yaw": 62, "type": "scene", "sceneId": "VR3@n", "targetYaw": 15, "cssClass": "gis-hot", "createTooltipFunc": "HOT", "createTooltipArgs": "餐廚"}]}};
function HOT(div, name) {
  const p = document.createElement('span');
  p.className = 'pill';
  p.textContent = '走到 ' + name;
  div.appendChild(p);
}
for (const s of Object.values(SCENES)) for (const h of s.hotSpots) h.createTooltipFunc = HOT;

const HAS_NIGHT = true;
// 目前模式：'' 白天、'@n' 燈光；網址加 #night 直接開燈光版
let SUF = (HAS_NIGHT && location.hash === '#night') ? '@n' : '';
const base = id => String(id).replace(/@n$/, '');
const viewer = pannellum.viewer('pano', {
  default: { firstScene: ROOMS[0].id + SUF, sceneFadeDuration: 700, autoLoad: true, showZoomCtrl: false, compass: false, minHfov: 50, maxHfov: 120 },
  scenes: SCENES
});

const roomsEl = document.getElementById('rooms');
const planEl = document.getElementById('plan');
const cone = document.createElement('div');
cone.className = 'cone';
planEl.appendChild(cone);
// 環景還在載入時切換房間會讓 pannellum 卡在黑畫面，所以先記下來，載完再切
let pending = null;
function go(id) {
  const t = base(id) + SUF;
  if (viewer.isLoaded()) { if (t !== viewer.getScene()) viewer.loadScene(t); }
  else pending = t;
}
viewer.on('load', () => {
  if (pending && pending !== viewer.getScene()) { const p = pending; pending = null; viewer.loadScene(p); }
  else pending = null;
});
const btns = {}, dots = {};
for (const r of ROOMS) {
  const b = document.createElement('button');
  b.type = 'button'; b.id = 'room-' + r.id; b.textContent = r.name;
  b.onclick = () => go(r.id);
  roomsEl.appendChild(b); btns[r.id] = b;
  const d = document.createElement('button');
  d.type = 'button'; d.className = 'dot'; d.title = r.name; d.setAttribute('aria-label', r.name);
  d.style.left = r.x + '%'; d.style.top = r.y + '%';
  d.onclick = () => go(r.id);
  planEl.appendChild(d); dots[r.id] = d;
}
function markRoom(id) {
  id = base(id);
  const r = ROOMS.find(x => x.id === id);
  document.getElementById('now').textContent = r ? r.name : '—';
  for (const k in btns) { btns[k].setAttribute('aria-current', String(k === id)); dots[k].setAttribute('aria-current', String(k === id)); }
  if (r) { cone.style.left = r.x + '%'; cone.style.top = r.y + '%'; }
  btns[id] && btns[id].scrollIntoView({ block: 'nearest', inline: 'center' });
}
viewer.on('scenechange', markRoom);
viewer.on('load', () => markRoom(viewer.getScene()));

// 白天／燈光切換：停在同一個房間、同一個視角
if (HAS_NIGHT) {
  const mDay = document.getElementById('mDay'), mNight = document.getElementById('mNight');
  const paint = () => { mDay.setAttribute('aria-pressed', String(!SUF)); mNight.setAttribute('aria-pressed', String(!!SUF)); };
  function setMode(night) {
    SUF = night ? '@n' : '';
    paint();
    history.replaceState(null, '', night ? '#night' : location.pathname + location.search);
    const cur = viewer.getScene(); if (!cur) return;
    const t = base(cur) + SUF; if (t === cur) return;
    if (viewer.isLoaded()) viewer.loadScene(t, viewer.getPitch(), viewer.getYaw(), viewer.getHfov());
    else pending = t;
  }
  mDay.onclick = () => setMode(false);
  mNight.onclick = () => setMode(true);
  addEventListener('hashchange', () => setMode(location.hash === '#night'));
  paint();
}
(function spin() { cone.style.transform = 'rotate(' + viewer.getYaw() + 'deg)'; requestAnimationFrame(spin); })();

const hint = document.getElementById('hint');
const hideHint = () => { hint.style.opacity = 0; };
viewer.on('mousedown', hideHint); viewer.on('touchstart', hideHint); setTimeout(hideHint, 10000);

const map = document.getElementById('map'), tog = document.getElementById('mapToggle');
function setMap(open) { map.dataset.closed = String(!open); tog.textContent = open ? '收起平面圖' : '平面圖'; tog.setAttribute('aria-expanded', String(open)); }
setMap(innerWidth >= 1000 && innerHeight >= 650);
tog.onclick = () => setMap(map.dataset.closed === 'true');
</script>

</body>
</html>

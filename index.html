<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.png">
<title>集思室內設計 環景導覽</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600&display=swap">
<style>
/* 案例清單：深色底、白色書法 logo、一案一列大卡片（老花友善大字） */
:root {
  --bg: #15130f;
  --card: #221f1a;
  --ink: #f4efe7;
  --ink-soft: #cfc6b8;
  --line: rgba(244, 239, 231, 0.16);
  --brass: #cdaa6b;
  --f-display: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --f-ui: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif;
  color-scheme: dark;
}
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 18px/1.6 var(--f-ui);
  padding-block: 40px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main { max-width: 880px; margin: 0 auto; display: grid; gap: 28px; }
header img { height: 84px; width: auto; display: block; margin-left: -6px; }
header p { margin: 6px 0 0; color: var(--ink-soft); font-size: 19px; }
.case { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); background: var(--card); border: 1px solid var(--line);
  border-radius: 16px; overflow: hidden; color: inherit; text-decoration: none; }
.case img { width: 100%; height: 100%; object-fit: cover; display: block; aspect-ratio: 1200 / 630; }
.case div { padding: 22px 24px; display: grid; align-content: center; gap: 6px; min-width: 0; }
.case .where { color: var(--brass); font-size: 15px; letter-spacing: 0.12em; }
.case h2 { margin: 0; font: 600 32px/1.25 var(--f-display); text-wrap: balance; }
.case .rooms { color: var(--ink-soft); }
.case .go { margin-top: 8px; font-weight: 700; color: var(--brass); }
.case:hover, .case:focus-visible { border-color: var(--brass); outline: none; }
@media (max-width: 640px) { .case { grid-template-columns: 1fr; } .case h2 { font-size: 28px; } }
</style>
</head>
<body>
<main>
  <header>
    <img src="logo.png" alt="集思室內設計 GIS INTERIOR DESIGN">
    <p>360° 環景導覽：按住拖曳四處看，點地上的標籤走到下一個房間。</p>
  </header>
  <a class="case" href="queen-wansui/">
    <img src="queen-wansui/og.jpg" alt="女王萬歲 客廳">
    <div>
      <span class="where">台中南區</span>
      <h2>女王萬歲</h2>
      <span class="rooms">玄關・餐廚・客廳・走道・主臥・次臥</span>
      <span class="go">進入導覽 ›</span>
    </div>
  </a>
  <a class="case" href="dengyang/">
    <img src="dengyang/og.jpg" alt="登陽大地悅章 客餐廳">
    <div>
      <span class="where">台中</span>
      <h2>登陽大地悅章</h2>
      <span class="rooms">玄關・客餐廳・客廳・主臥室・女孩房・男孩房</span>
      <span class="go">進入導覽 ›</span>
    </div>
  </a>
  <a class="case" href="new-dubai/">
    <img src="new-dubai/og.jpg" alt="新杜拜社區 客廳">
    <div>
      <span class="where">台中</span>
      <h2>新杜拜社區</h2>
      <span class="rooms">玄關・餐廚・客廳・走道・書房・主臥・女兒房</span>
      <span class="go">進入導覽 ›</span>
    </div>
  </a>
  <a class="case" href="chongde/">
    <img src="chongde/og.jpg" alt="崇德仁美 客廳">
    <div>
      <span class="where">台中</span>
      <h2>崇德仁美</h2>
      <span class="rooms">玄關・客廳・餐廚・書房・主臥</span>
      <span class="go">進入導覽 ›</span>
    </div>
  </a>
  <a class="case" href="shizheng/">
    <img src="shizheng/og.jpg" alt="市政一號院 客廳">
    <div>
      <span class="where">台中</span>
      <h2>市政一號院</h2>
      <span class="rooms">玄關・客廳・餐廚・主臥・小孩房</span>
      <span class="go">進入導覽 ›</span>
    </div>
  </a>
</main>
</body>
</html>
